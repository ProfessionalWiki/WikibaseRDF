name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "PHPUnit: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          - mw: 'REL1_43'
            php: 8.1
            experimental: false
          - mw: 'REL1_43'
            php: 8.2
            experimental: false
          - mw: 'REL1_43'
            php: 8.3
            experimental: false
          - mw: 'master'
            php: 8.4
            experimental: true

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          tools: composer

      - uses: alistair3149/setup-mediawiki@alistair3149/rewrite
        with:
          mw-version: ${{ matrix.mw }}
          extension: WikibaseRDF
          dependencies: Wikibase
          settings: |
            wfLoadExtension( 'WikibaseRepository', __DIR__ . '/extensions/Wikibase/extension-repo.json' );
            require_once __DIR__ . '/extensions/Wikibase/repo/ExampleSettings.php';

      - name: Run update.php
        run: php maintenance/update.php --quick

      - name: Run PHPUnit
        run: php tests/phpunit/phpunit.php -c extensions/WikibaseRDF/
        if: matrix.mw != 'master'

      - name: Run PHPUnit with code coverage
        run: php tests/phpunit/phpunit.php -c extensions/WikibaseRDF/ --coverage-clover coverage.xml
        if: matrix.mw != 'master'

      - name: Upload code coverage
        run: bash <(curl -s https://codecov.io/bash)
        if: matrix.mw == 'master'




  PHPStan:
    name: "PHPStan"

    strategy:
      matrix:
        include:
          - mw: 'REL1_43'
            php: '8.3'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer, cs2pr

      - uses: alistair3149/setup-mediawiki@alistair3149/rewrite
        with:
          mw-version: ${{ matrix.mw }}
          extension: WikibaseRDF
          dependencies: Wikibase
          settings: |
            wfLoadExtension( 'WikibaseRepository', __DIR__ . '/extensions/Wikibase/extension-repo.json' );
            require_once __DIR__ . '/extensions/Wikibase/repo/ExampleSettings.php';

      - name: Composer install
        run: cd extensions/WikibaseRDF && composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPStan
        run: cd extensions/WikibaseRDF && php vendor/bin/phpstan analyse --error-format=checkstyle --no-progress | cs2pr




  Psalm:
      name: "Psalm: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"

      strategy:
        matrix:
          include:
            - mw: 'REL1_43'
              php: '8.3'

      runs-on: ubuntu-latest

      defaults:
          run:
              working-directory: mediawiki

      steps:
          - name: Setup PHP
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ matrix.php }}
                extensions: mbstring
                tools: composer, cs2pr

          - uses: alistair3149/setup-mediawiki@alistair3149/rewrite
            with:
                mw-version: ${{ matrix.mw }}
                extension: WikibaseRDF
                dependencies: Wikibase
                settings: |
                    wfLoadExtension( 'WikibaseRepository', __DIR__ . '/extensions/Wikibase/extension-repo.json' );
                    require_once __DIR__ . '/extensions/Wikibase/repo/ExampleSettings.php';

          - name: Composer install
            run: cd extensions/WikibaseRDF && composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

          - name: Psalm
            run: cd extensions/WikibaseRDF && pwd && php vendor/bin/psalm --config=psalm.xml --shepherd --stats




  code-style:
    name: "Code style: MW ${{ matrix.mw }}, PHP ${{ matrix.php }}"

    strategy:
      matrix:
        include:
          - mw: 'REL1_43'
            php: '8.3'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mediawiki/extensions/WikibaseRDF

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, php-ast
          tools: composer

      - uses: alistair3149/setup-mediawiki@alistair3149/rewrite
        with:
          mw-version: ${{ matrix.mw }}
          extension: WikibaseRDF
          dependencies: Wikibase
          settings: |
            wfLoadExtension( 'WikibaseRepository', __DIR__ . '/extensions/Wikibase/extension-repo.json' );
            require_once __DIR__ . '/extensions/Wikibase/repo/ExampleSettings.php';

      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - run: vendor/bin/phpcs -p -s

  linting:
    name: "Linting"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"
      - run: npm install
      - run: npm run test
